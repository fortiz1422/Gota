name: Mercado Pago transactional SQL

on:
  push:
    branches: [feat/mercadopago-integration-v2]
    paths:
      - '.github/workflows/mercadopago-sql.yml'
      - 'scripts/*mercadopago*'
      - 'docs/supabase-mercadopago-*.sql'
  pull_request:
    paths:
      - '.github/workflows/mercadopago-sql.yml'
      - 'scripts/*mercadopago*'
      - 'docs/supabase-mercadopago-*.sql'
      - 'app/api/integrations/mercadopago/**'
      - 'components/mercadopago/**'
      - 'components/dashboard/ParsePreview.tsx'
      - 'lib/mercadopago/**'
      - 'lib/counterparty-aliases/**'

permissions:
  contents: read

concurrency:
  group: mercadopago-sql-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Mercado Pago review and confirmation tests
        run: npx vitest run lib/mercadopago/confirm-expense.test.ts lib/mercadopago/confirm-expense-route.test.ts lib/mercadopago/movements-route.test.ts lib/mercadopago/review-dismissal.test.ts lib/mercadopago/review-presentation.test.ts lib/mercadopago/sync-presentation.test.ts lib/counterparty-aliases/integration.test.ts lib/counterparty-aliases/counterparty-aliases.test.ts
      - name: TypeScript check
        run: npx tsc --noEmit

  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Transactional installments and concurrent clients
        run: node scripts/test-mercadopago-installments-pglite.mjs --docker
      - name: Duplicate resolution, audited posting and concurrent clients
        run: node scripts/test-mercadopago-postings-pglite.mjs --docker
      - name: Single installment legacy RPC with deployed card ID type
        run: node scripts/test-mercadopago-card-confirmation-sql.mjs
      - name: Wallet payment confirmation and operation identity
        run: node scripts/test-mercadopago-wallet-confirmation-sql.mjs
      - name: Review tag parity wrappers
        run: node scripts/test-mercadopago-review-tags-sql.mjs
